<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Grand Theft Argon — 1986 Cel-Shaded 3D Action Engine</title>
  <link rel="stylesheet" href="./styles.css?v=10" />
</head>
<body>
  <div id="vc-canvas-container"></div>
  <div id="vc-comic-frame"></div>
  <div id="vc-context-prompt"></div>

  <!-- Hidden by default; press ` (Backquote) or pass ?debug=1 to inspect presets -->
  <div id="vc-debug-bar">
    <button type="button" data-action="time-day">Day 15:04</button>
    <button type="button" data-action="time-sunset">Sunset 18:45</button>
    <button type="button" data-action="time-night">Night 02:01</button>
    <button type="button" data-action="wanted-up">+Wanted ★</button>
    <button type="button" data-action="cop-takedown">Cop Takedown ✕</button>
    <button type="button" data-action="hotwire">Hotwire Exotic</button>
    <button type="button" data-action="molotov">Gas Molotov</button>
    <button type="button" data-action="dumpster">Dumpster Stash</button>
    <button type="button" data-action="pda">1986 Pager PDA</button>
    <button type="button" data-action="rampage">Start Blitz</button>
    <button type="button" data-action="boat">Board Speedboat</button>
    <button type="button" data-action="plane">Fly Seaplane ✈️</button>
    <button type="button" data-action="heli">Fly Chopper 🚁</button>
    <button type="button" data-action="stunt">Stunt Jump 🚀</button>
    <button type="button" data-action="suburbs">Suburbs 🏡</button>
    <button type="button" data-action="reseed">Reseed City [N] 🎲</button>
  </div>

  <script src="./bundle.js?v=10"></script>
</body>
</html>
